########################################################################################
###                               ENVIRONMENT & SYSTEM                               ###
########################################################################################

# ── Environment bootstrap ──────────────────────────────────────────────────────────
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Cursor & theme environment ─────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

exec-once=hyprctl setcursor hypr-dots-blue 24
exec-once=gsettings set org.gnome.desktop.interface cursor-theme 'hypr-dots-blue' &> /dev/null
exec-once = gsettings set org.gnome.desktop.interface font-name 'JetBrains Mono Nerd Font 11'
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"


########################################################################################
###                                    MONITORS                                      ###
########################################################################################

# ── Monitor layout ──────────────────────────────────────────────────────────────────
monitor = DP-1, 1920x1080@360, 0x0, 1
monitor = DP-3, 1920x1080@60, -1080x-680, 1, transform, 1

# ── Workspace assignment ────────────────────────────────────────────────────────────
workspace = 1,monitor:DP-1
workspace = 2,monitor:DP-1
workspace = 3,monitor:DP-1
workspace = 4,monitor:DP-1
workspace = 5,monitor:DP-1
workspace = 6,monitor:DP-1
workspace = 7,monitor:DP-1
workspace = 8,monitor:DP-1 
workspace = 9,monitor:DP-1
workspace = 10,monitor:DP-3


########################################################################################
###                                   MY PROGRAMS                                    ###
########################################################################################

# ── Default applications ────────────────────────────────────────────────────────────
$terminal = alacritty
$fileManager = nemo
$menu = rofi -show drun 
$powermenu = zsh ~/.config/rofi/powermenu.sh
$screenshot = hyprshot -m region -m active --clipboard-only
$hyprlock = hyprlock

# ── Panels ──────────────────────────────────────────────────────────────────────────
$killpanel = killall waybar
$startpanel = waybar


########################################################################################
###                                   KEYBINDINGS                                    ###
########################################################################################

$mainMod = SUPER 

# ── Applications & essentials ───────────────────────────────────────────────────────
bind = alt, return, exec, $terminal
bind = alt, Q, killactive,
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, E, exec, $fileManager
bind = alt, F, togglefloating,
bind = alt, D, exec, $menu
bind = alt, Backspace, exec, $powermenu
bind = $mainMod, A, movefocus, l
bind = $mainMod, D, movefocus, r
bind = $mainMod, W, movefocus, u
bind = $mainMod, S, movefocus, d
bind = alt, f1, exec, $screenshot
bind = $mainMod, k, exec, $killpanel
bind = $mainMod, j, exec, $startpanel
bind = $mainMod, l, exec, $hyprlock

# ── Workspace navigation ────────────────────────────────────────────────────────────
bind = alt, 1, workspace, 1
bind = alt, 2, workspace, 2
bind = alt, 3, workspace, 3
bind = alt, 4, workspace, 4
bind = alt, 5, workspace, 5
bind = alt, 6, workspace, 6
bind = alt, 7, workspace, 7
bind = alt, 8, workspace, 8
bind = alt, 9, workspace, 9

# ── Move window to workspace ─────────────────────────────────────────────────────────
bind = $mainMod, 1, movetoworkspace, 1
bind = $mainMod, 2, movetoworkspace, 2
bind = $mainMod, 3, movetoworkspace, 3
bind = $mainMod, 4, movetoworkspace, 4
bind = $mainMod, 5, movetoworkspace, 5
bind = ctrl+shift, 1, movetoworkspace, 6
bind = ctrl+shift, 2, movetoworkspace, 7
bind = ctrl+shift, 3, movetoworkspace, 8
bind = ctrl+shift, 4, movetoworkspace, 9
bind = ctrl+shift, 5, movetoworkspace, 10

# ── Mouse bindings ──────────────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


########################################################################################
###                                    AUTOSTART                                     ###
########################################################################################

# ── Startup services ────────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = swww-daemon
exec-once = ~/.local/bin/wallpaper-loop.sh
exec-once = swww-daemon
exec-once = hyprpm reload
exec-once = dunst


########################################################################################
###                                  LOOK AND FEEL                                   ###
########################################################################################

# ── General ─────────────────────────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(00000000)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle 
}

# ── Decoration ──────────────────────────────────────────────────────────────────────
decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true, glow
        range = 25
        render_power = 1000
        color = rgba(89b4faff)
        color_inactive = rgba(00000000)
    }
    blur {
        enabled = true
        size = 1
        passes = 5
        vibrancy = 0.1696
        new_optimizations = true
    }
}

# ── Animations ──────────────────────────────────────────────────────────────────────
animations {
    enabled = true, animations
    bezier = winIn, 0.1, 1.0, 0.1, 1.0
    bezier = winOut, 0.1, 1.0, 0.1, 1.0
    bezier = smoothOut, 0.5, 0, 0.99, 0.99
    bezier = layerOut,0.23,1,0.32,1
    animation = border, 0, 1, default
    animation = windowsIn, 1, 7, winIn, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 7, winIn, slide
    animation = workspacesIn, 1, 8, winIn, slide
    animation = workspacesOut, 1, 8, winOut, slide
    animation = layersIn, 1, 10, winIn, slide
    animation = layersOut, 1, 3, layerOut, popin 50%
}

# ── Dwindle ─────────────────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    force_split = 2
    preserve_split = true
}

# ── OpenGL ──────────────────────────────────────────────────────────────────────────
opengl {
    nvidia_anti_flicker = true
}

# ── Misc ────────────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    vfr = false
}


########################################################################################
###                                      INPUT                                       ###
########################################################################################

# ── Keyboard & pointer ──────────────────────────────────────────────────────────────
input {
    kb_layout = no,de
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_space_toggle
    kb_rules =
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.3
    repeat_rate = 50        
    repeat_delay = 200 
    touchpad {
        natural_scroll = false
    }
}

# ── Cursor ──────────────────────────────────────────────────────────────────────────
cursor {
    no_hardware_cursors = true
    hotspot_padding = 2
    no_warps = true
}

# ── Debug ───────────────────────────────────────────────────────────────────────────
debug {
    damage_tracking = 1
}


########################################################################################
###                              WINDOWS AND WORKSPACES                              ###
########################################################################################

# ── Window rules ────────────────────────────────────────────────────────────────────
