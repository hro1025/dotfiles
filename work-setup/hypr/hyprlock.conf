########################################################################################
###                                      VARIABLES                                   ###
########################################################################################

$font = JetBrainsMono Nerd Font
$base = rgb(1e1e2e)
$accent = rgb(89b4fa)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)


########################################################################################
###                                       GENERAL                                    ###
########################################################################################

general {
  hide_cursor = true
}


########################################################################################
###                                      BACKGROUND                                  ###
########################################################################################

background {
  monitor =
  path = screenshot
  blur_passes = 3
  color = $base
}


########################################################################################
###                                        TIME                                      ###
########################################################################################

label {
  monitor =
  text = $TIME
  color = $accent
  font_size = 90
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}


########################################################################################
###                                        DATE                                      ###
########################################################################################

label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $accent
  font_size = 25
  font_family = $font
  position = 0, 50
  halign = center
  valign = center
}


########################################################################################
###                                     INPUT FIELD                                  ###
########################################################################################

input-field {
  monitor =
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $base
  font_color = $accent
  fade_on_empty = false
  placeholder_text =
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
